name: Integration Tests (manual)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests if present'
        required: true
        default: 'yes'

jobs:
  integration:
    name: Integration tests (manual)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_integration == 'yes' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests (if any)
        env:
          TAPO_EMAIL: ${{ secrets.TAPO_EMAIL }}
          TAPO_PASSWORD: ${{ secrets.TAPO_PASSWORD }}
        run: |
          if [ -d "__tests__/integration" ] && [ "$(ls -A __tests__/integration)" ]; then
            echo "Running integration tests..."
            npm test -- --testPathPattern="__tests__/integration"
          else
            echo "No integration tests present. Nothing to run."
          fi
