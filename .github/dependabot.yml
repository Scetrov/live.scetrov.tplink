version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Note: Dependabot natively supports "daily", "weekly", or "monthly" intervals.
      # "weekly" is used here as the closest standard interval to a 5-day cooldown.
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        patterns:
          - "*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
